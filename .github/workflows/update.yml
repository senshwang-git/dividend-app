name: 시세 갱신 및 배포

# 평일 하루 두 번 시세를 받아 앱을 다시 배포한다 (국내 장 마감 뒤 · 미국 장 마감 뒤)
on:
  schedule:
    - cron: '47 7 * * 1-5'    # 16:47 KST
    - cron: '17 22 * * 1-5'   # 07:17 KST (다음 날)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 엔진 테스트
        run: node --test dividend/*.test.mjs
      - name: 시세 수집
        if: github.event_name != 'push'
        env:
          DIVIDEND_OUTPUT: site/data.json
        run: |
          pip install yfinance pandas
          python dividend/fetch_data.py
      - name: 시세 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "chore: 시세 갱신 [skip ci]" && git push)
      - name: gh-pages 배포
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "deploy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
